# Daily landslide outlook for Himachal Pradesh.
# Runs every morning, scores all of HP for today and tomorrow, emails the
# result and publishes the web page. Nothing is committed by this workflow:
# results go to the web page (GitHub Pages) and to a downloadable run record.
name: Daily landslide outlook

on:
  schedule:
    # GitHub starts scheduled runs "when it can": in the first days the 10:00 IST
    # run started 7-8 hours late. So it is asked three times each morning; the
    # first attempt that starts does the work, later ones see it is done and stop.
    - cron: "30 0 * * *"      # 00:30 UTC = 06:00 IST
    - cron: "30 2 * * *"      # 02:30 UTC = 08:00 IST
    - cron: "30 4 * * *"      # 04:30 UTC = 10:00 IST
  workflow_dispatch:          # "Run workflow" button: always runs

permissions:
  contents: read
  actions: read               # lets the check step see earlier runs of this workflow
  pages: write
  id-token: write

concurrency:
  group: daily-outlook
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      done: ${{ steps.today.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - name: Has today's outlook already been made?
        id: today
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 src/live_00_already_ran_today.py >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: check
    if: needs.check.outputs.done != 'true'
    runs-on: ubuntu-24.04     # fixed version: the first run (9 Nov 2026) worked on it; avoids a mid-trial switch to Ubuntu 26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - name: Install packages
        run: pip install -r requirements-live.txt
      - name: Daily run
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          ALERT_SENDER: ${{ secrets.ALERT_SENDER }}
          ALERT_APP_PASSWORD: ${{ secrets.ALERT_APP_PASSWORD }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -W ignore src/live_03_daily_run.py
      - name: Keep a record of this run (downloadable for 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: site/
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  publish:
    needs: run                # skipped automatically when "run" is skipped
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
